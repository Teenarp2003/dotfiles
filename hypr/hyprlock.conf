# GENERAL
general {
    fail_timeout = 500
    ignore_empty_input = true
    screencopy_mode = 0 
}

# Profie-Photo
image {
    monitor =
    path = ~/.config/wallpaper/mount-fuji.png
    border_size = 2
    border_color = rgba(255, 255, 255, 0)
    size = 60
    rounding = -1
    rotate = 0
    reload_time = -1
    reload_cmd = 
    position = 0, -270
    halign = center
    valign = center
}

# Day-Month-Date
label {
    monitor =
    text = cmd[update:1000] echo -e "$(date +"%A, %B %d")"
    color = rgba(216, 222, 233, 0.70)
    font_size = 40
    font_family = steelfish outline regular
    position = 0, 370
    halign = center
    valign = center
}

# Time
label {
    monitor =
    text = cmd[update:1000] echo "<span>$(date +"%I:%M")</span>"
    color = rgba(216, 222, 233, 0.70)
    font_size = 200
    font_family = steelfish outline regular
    position = 0, 200
    halign = center
    valign = center
}

# USER-BOX
shape {
    monitor =
    size = 220, 50
    color = rgba(255, 255, 255, .1)
    rounding = -1
    border_size = 0
    border_color = rgba(253, 198, 135, 0)
    rotate = 0
    xray = false # if true, make a "hole" in the background (rectangle of specified size, no rotation)

    position = 0, -350
    halign = center
    valign = center
}

# USER
label {
    monitor =
    text =   $USER
    color = rgba(216, 222, 233, 0.80)
    outline_thickness = 2
    dots_size = 0.2 # Scale of input-field height, 0.2 - 0.8
    dots_spacing = 0.2 # Scale of dots' absolute size, 0.0 - 1.0
    dots_center = true
    font_size = 15
    font_family = Iosevka Nerd Font
    position = 0, -350
    halign = center
    valign = center
}

# INPUT FIELD
input-field {
    monitor =
    size = 220, 50
    outline_thickness = 2
    dots_size = 0.2 # Scale of input-field height, 0.2 - 0.8
    dots_spacing = 0.2 # Scale of dots' absolute size, 0.0 - 1.0
    dots_center = true
    outer_color = rgba(0, 0, 0, 0)
    inner_color = rgba(255, 255, 255, 0.1)
    font_color = rgb(200, 200, 200)
    fade_on_empty = false
    font_family = Iosevka Nerd Font
    font_size = 10
    placeholder_text = <i><span foreground="##ffffff99">🔒 Enter Pass</span></i>
    hide_input = false
    position = 0, -410
    halign = center
    valign = center
}

# CURRENT SONG
label {
    monitor =
    text = cmd[update:1000] echo "$(~/.config/hypr/Scripts/songdetail.sh)" 
    color = rgba(255, 255, 255, 0.6)
    font_size = 15
    font_family = Iosevka Nerd Font
    position = 0, 40
    halign = center
    valign = bottom
}
